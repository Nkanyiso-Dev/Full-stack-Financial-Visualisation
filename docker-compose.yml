# Run the whole stack:   cp .env.example .env && docker compose up --build
# Then open http://localhost:8080

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${DB_NAME:-finance_db}
      MYSQL_USER: ${DB_USER:-finance_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me-app}
    volumes:
      - db_data:/var/lib/mysql
      # Runs once, on first start of an empty volume.
      - ./backend/db_setup.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP, so this only passes once the *real* server is
      # up (not the temporary init server, which listens on the socket only).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-finance_app}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-app}
      DB_NAME: ${DB_NAME:-finance_db}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
