name: API Contract Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: MyStrongPass123!
          MYSQL_DATABASE: finance_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Create virtual environment & install dependencies
        run: |
          python -m venv backend/venv
          source backend/venv/bin/activate
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          # optional: install pytest if you have Python contract tests
          pip install pytest

      - name: Start Flask app in background
        env:
          FLASK_APP: backend/app.py
          FLASK_ENV: development
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: MyStrongPass123!
          DB_NAME: finance_test_db
          TEST_DB_NAME: finance_test_db
        run: |
          source backend/venv/bin/activate
          # wait for MySQL to be ready
          for i in {1..30}; do
            if nc -z 127.0.0.1 3306; then
              echo "MySQL is up"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done
          nohup python -m flask run --host=0.0.0.0 --port=5000 > flask.log 2>&1 &
          sleep 5

      - name: Run API contract tests
        env:
          CI: true
        run: |
          source backend/venv/bin/activate
          npm install -g newman newman-reporter-html
          newman run postman_tests/finance_api_contract.json \
            -r html \
            --reporter-html-export reports/finance_api_contract_report.html
          # optional: run Python tests if they exist
          if [ -d "backend/tests/contract" ]; then
            pytest backend/tests/contract || true
          fi
