<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h2 {
            margin-top: 30px;
        }
        form {
            margin-bottom: 20px;
        }
        input, button {
            margin: 5px;
            padding: 8px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
            margin-top: 10px;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 8px;
            text-align: center;
        }
        canvas {
            margin-top: 20px;
        }
        #resultMsg {
            margin-bottom: 10px;
            color: green;
        }
        #errorMsg {
            margin-bottom: 10px;
            color: red;
        }
    </style>
</head>
<body>
    <h2>Upload Financial Data</h2>
    <form id="uploadForm">
        <input type="file" id="file" accept=".xlsx" required>
        <input type="number" id="userId" placeholder="User ID" required>
        <input type="number" id="year" placeholder="Year" required>
        <button type="submit">Upload</button>
    </form>
    <div id="resultMsg"></div>
    <div id="errorMsg"></div>

    <h2>Dashboard</h2>
    <table id="dataTable">
        <thead>
            <tr><th>Month</th><th>Amount</th></tr>
        </thead>
        <tbody></tbody>
    </table>
    <canvas id="barChart" width="600" height="300"></canvas>

    <script>
        document.getElementById("uploadForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            document.getElementById("resultMsg").textContent = "";
            document.getElementById("errorMsg").textContent = "";

            let file = document.getElementById("file").files[0];
            let userId = document.getElementById("userId").value.trim();
            let year = document.getElementById("year").value.trim();

            if (!file || !userId || !year) {
                document.getElementById("errorMsg").textContent = "Please fill in all fields and select a file.";
                return;
            }

            let formData = new FormData();
            formData.append("file", file);

            try {
                let uploadRes = await fetch(`http://127.0.0.1:5000/api/finances/upload/${userId}/${year}`, {
                    method: "POST",
                    body: formData
                });

                let uploadData = await uploadRes.json();
                if (!uploadRes.ok) {
                    document.getElementById("errorMsg").textContent = uploadData.error || "Upload failed.";
                    return;
                } else {
                    document.getElementById("resultMsg").textContent = 
                        `Upload successful: ${uploadData.inserted} inserted, ${uploadData.skipped} skipped.`;
                }

                let res = await fetch(`http://127.0.0.1:5000/api/finances/${userId}/${year}`);
                let data = await res.json();

                let tableBody = document.querySelector("#dataTable tbody");
                tableBody.innerHTML = "";
                let labels = [], values = [];

                data.forEach(r => {
                    let row = `<tr><td>${r.month}</td><td>${r.amount}</td></tr>`;
                    tableBody.innerHTML += row;
                    labels.push(r.month);
                    values.push(r.amount);
                });

                let ctx = document.getElementById("barChart").getContext("2d");
                if (window.barChartInstance) {
                    window.barChartInstance.destroy();
                }
                window.barChartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: "Monthly Amount",
                            data: values,
                            backgroundColor: "rgba(54, 162, 235, 0.6)",
                            borderColor: "rgba(54, 162, 235, 1)",
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            } catch (err) {
                console.error("Error:", err);
                document.getElementById("errorMsg").textContent = "Something went wrong while uploading or fetching data.";
            }
        });
    </script>
</body>
</html>
